name: poi-intel

# 一键部署编排：MySQL + Spring Boot + Nginx(前端)
#
#   cp .env.deploy.example .env     # 首次
#   docker compose --env-file .env up -d --build
#
# 端口默认：web 8081 / api 18080（仅本机）/ mysql 3307（仅本机）

services:
  mysql:
    image: mysql:8.0
    container_name: poi-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 设置数据库 root 口令}
      MYSQL_DATABASE: ${DB_NAME:-poi_intel}
      # 业务账号：backend 不再用 root 连库
      MYSQL_USER: ${DB_USER:-poi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?必须在 .env 设置数据库业务口令}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 只绑本机，避免把数据库暴露到局域网
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    logging:
      # 容器日志轮转：json-file 默认无限增长，长期跑会撑爆磁盘
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks: [poi-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: poi-intel-backend:latest
    container_name: poi-backend
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-poi_intel}
      DB_USER: ${DB_USER:-poi}
      DB_PASSWORD: ${DB_PASSWORD:?必须在 .env 设置数据库业务口令}
      # 留空则启动时生成随机密钥（重启后 token 失效）
      AUTH_SECRET: ${AUTH_SECRET:-}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?必须在 .env 设置随机运营口令}
      APP_AUTH_ALLOW_DEFAULT_PASSWORD: 'false'
      # 抓取代理：容器内访问宿主代理要用 host.docker.internal
      HTTP_PROXY: ${INGEST_PROXY:-}
      TZ: Asia/Shanghai
    extra_hosts:
      # Linux 上也能解析 host.docker.internal
      - 'host.docker.internal:host-gateway'
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 仅本机暴露，便于直接用 curl 调接口；平时可删掉
      - '127.0.0.1:${API_PORT:-18080}:8080'
    restart: unless-stopped
    logging:
      # 容器日志轮转：json-file 默认无限增长，长期跑会撑爆磁盘
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks: [poi-net]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: poi-intel-web:latest
    container_name: poi-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8081}:80'
      # HTTPS（自签证书；正式环境换 CA 证书）
      - '${WEB_SSL_PORT:-8443}:443'
    restart: unless-stopped
    logging:
      # 容器日志轮转：json-file 默认无限增长，长期跑会撑爆磁盘
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks: [poi-net]

volumes:
  mysql-data:

networks:
  poi-net:
    driver: bridge
