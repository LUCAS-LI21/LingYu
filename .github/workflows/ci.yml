name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint / Format / Type / Unit / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    services:
      # 后台管理用例需要真实后端，CI 里起一套 MySQL 供后端连接
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: poi_intel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn -B -q -DskipTests package

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: poi_intel
          DB_USER: root
          DB_PASSWORD: root
          OPERATOR_PASSWORD: operator123
          APP_AUTH_ALLOW_DEFAULT_PASSWORD: 'true'
        run: |
          nohup java -jar backend/target/poi-intel.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "backend ready"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          OPERATOR_PASSWORD: operator123
        run: pnpm e2e

      - name: Backend log on failure
        if: failure()
        run: tail -n 120 backend.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Build & Push Image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize repo name (GHCR requires lowercase)
        id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lc }}:latest
            ghcr.io/${{ steps.repo.outputs.lc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
