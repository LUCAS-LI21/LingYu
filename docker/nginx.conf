server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    # ---------- 健康检查（容器 HEALTHCHECK / K8s probe 共用）----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------- 带 hash 的静态资源：一年强缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- HTML 入口：绝不缓存，保证发版即时生效 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 接口反代（compose 内服务名 backend）----------
    # 用变量 + 运行时 DNS 解析：后端未启动时 nginx 仍能正常启动，只对该路径返回 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream backend:8080;

    location /api/ {
        # 不要剥掉 /api 前缀：后端路由本来就是 /api/v1/**，
        # 之前 rewrite 成 /v1/** 会导致 /v1/health 500、前端探测失败后静默回退本地种子。
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 同源反代：浏览器带来的 Origin 是 http://<部署地址>:8081，后端 CORS 白名单
        # 只放开发环境的 5173，不去掉会被判跨域直接 403（后台登录就挂在这里）。
        # 与 vite dev 代理的处理保持一致。
        proxy_set_header   Origin  "";
        proxy_set_header   Referer "";
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
