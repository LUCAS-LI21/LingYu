# 访问日志：带耗时（rt/urt）、上游地址、真实客户端 IP、请求 id
# 默认 combined 格式没有耗时和 XFF，排障时无法区分"慢在前端还是后端"
log_format poi '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
               'rt=$request_time urt=$upstream_response_time '
               'rid=$request_id xff=$http_x_forwarded_for ua="$http_user_agent"';
access_log /var/log/nginx/access.log poi;

# HTTP 只做两件事：健康检查（容器 HEALTHCHECK 走 http）+ 跳转 HTTPS
server {
    listen       80;
    server_name  _;

    # 健康检查放在跳转之前，容器探针用 http 也能拿到 200
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    # 自签证书由镜像构建时生成（见 Dockerfile）；正式环境替换为 CA 证书
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 让前端报错时能带上链路 id，与后端日志、nginx 访问日志对得上
    add_header X-Request-Id             $request_id always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    # ---------- 健康检查（https 侧）----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------- 带 hash 的静态资源：一年强缓存 ----------
    # 注意：location 里一旦出现 add_header，server 级 add_header 不再继承，
    # 所以安全头必须在这里重复声明，否则 /assets/* 会丢 nosniff / X-Frame-Options。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---------- HTML 入口：绝不缓存，保证发版即时生效 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------- 接口反代（compose 内服务名 backend）----------
    # 用变量 + 运行时 DNS 解析：后端未启动时 nginx 仍能正常启动，只对该路径返回 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream backend:8080;

    location /api/ {
        # 不要剥掉 /api 前缀：后端路由本来就是 /api/v1/**，
        # 之前 rewrite 成 /v1/** 会导致 /v1/health 500、前端探测失败后静默回退本地种子。
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 把 nginx 生成的 request id 透传给后端，日志可用同一 id 串起来
        proxy_set_header   X-Request-Id      $request_id;
        # 同源反代：浏览器带来的 Origin 是 http://<部署地址>:8081，后端 CORS 白名单
        # 只放开发环境的 5173，不去掉会被判跨域直接 403（后台登录就挂在这里）。
        # 与 vite dev 代理的处理保持一致。
        proxy_set_header   Origin  "";
        proxy_set_header   Referer "";
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
