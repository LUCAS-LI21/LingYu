server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: poi-intel
  datasource:
    # 主机/端口/库名都可用环境变量覆盖，容器里传 DB_HOST=mysql 即可
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:poi_intel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: info
    com.poiintel: info
    org.springframework.jdbc.datasource.init: warn

app:
  auth:
    # 留空则启动时生成临时密钥（重启后 token 失效）；生产必须显式配置
    secret: ${AUTH_SECRET:}
    ttl-minutes: 720
    operator-username: ${OPERATOR_USERNAME:operator}
    operator-password: ${OPERATOR_PASSWORD:operator123}
  ingest:
    # Java 直连 Overpass 会被 502，必须走本机代理；留空则直连
    proxy: ${HTTP_PROXY:}
    user-agent: poi-intel-demo/0.1 (academic demo; contact 2396845790@qq.com)
    endpoints: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter
    # 定时抓取：默认 30 分钟一次，启动后 2 分钟首跑
    enabled: true
    schedule-ms: 1800000
    initial-delay-ms: 120000
