server:
  port: 8080
  shutdown: graceful
  # 首屏一次拉 5000+ 点位，未压缩约 2.9MB；开 gzip 后约 1/6（实测见 MEMORY）
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 2048

spring:
  application:
    name: poi-intel
  datasource:
    # 主机/端口/库名都可用环境变量覆盖，容器里传 DB_HOST=mysql 即可
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:poi_intel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  sql:
    init:
      # 结构演进统一走 db/migration/*.sql（SchemaMigrator 顺序执行 + schema_version 记账），
      # 不再每次启动重跑 schema.sql：它含 DROP VIEW，中途失败会让 /pois 直接不可用。
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: info
    com.poiintel: info
    org.springframework.jdbc.datasource.init: warn
  pattern:
    # %X{requestId} 由 RequestIdFilter 写入；排查前端报错时凭响应头 X-Request-Id 反查日志
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-req}] %logger{36} - %msg%n'

management:
  endpoints:
    web:
      exposure:
        # 只暴露排障需要的三个，metrics 用于看 QPS/延迟/连接池
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: poi-intel

app:
  auth:
    # 留空则启动时生成临时密钥（重启后 token 失效）；生产必须显式配置
    secret: ${AUTH_SECRET:}
    ttl-minutes: 720
    operator-username: ${OPERATOR_USERNAME:operator}
    operator-password: ${OPERATOR_PASSWORD:operator123}
  ingest:
    # Java 直连 Overpass 会被 502，必须走本机代理；留空则直连
    proxy: ${HTTP_PROXY:}
    user-agent: poi-intel-demo/0.1 (academic demo; contact poi-intel@example.com)
    endpoints: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter,https://overpass.private.coffee/api/interpreter
    # 定时抓取：默认 30 分钟一次，启动后 2 分钟首跑
    enabled: true
    schedule-ms: 1800000
    initial-delay-ms: 120000
  live:
    # L2 实时层：只用于「查地址」等即时展示，绝不落库（高德协议 3.5）
    # 留空则前端显示不可用，但保留「补充地址」的反馈入口
    # Key 必须是「Web服务」平台类型（ADR-0002）；调用前本地做 WGS-84 → GCJ-02 转换
    amap-key: ${AMAP_KEY:}
    # 每日预算闸门（ADR-0002 §7）：个人认证基础 LBS 15 万/月、基础搜索仅 5,000/月
    # 总预算覆盖两个接口；周边搜索单独更低，防止把最贵的搜索池打穿
    daily-budget: ${LIVE_DAILY_BUDGET:300}
    daily-budget-around: ${LIVE_DAILY_BUDGET_AROUND:100}
    # 全局最小调用间隔，挡住连点与循环触发
    min-interval-ms: ${LIVE_MIN_INTERVAL_MS:200}
  agent:
    # 数据接入 Agent：搜索 + 抽取 + 复核，产出建议后由管理员采纳
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    # 每日 03:30 自动补一批（免费时段，价格是高峰一半）；默认关闭
    schedule-enabled: ${AGENT_SCHEDULE_ENABLED:false}
    batch-size: 10
    cron: 0 30 3 * * *
